# Alembic configuration for the Hirenovik Supabase PostgreSQL database.
#
# The real DATABASE_URL is NEVER stored here -- it is resolved at runtime from
# the environment via src/shared/config.py (single source of truth, see
# CONVENTIONS.md section 1). Keeping credentials out of this file prevents
# accidental secret leaks in git.
#
# Run from the repository root:
#   alembic upgrade head
#   alembic revision -m "describe change"      # manual revision
#   alembic revision --autogenerate -m "..."    # diff against current models

[alembic]
# migrations live at repo root so they are a top-level tooling folder, like
# infrastructure/ and scripts/, rather than an importable src/ package.
script_location = migrations

# Prepend a timestamp + short revision hash to generated script filenames so
# revisions stay ordered chronologically even after merges.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use UTC timestamps so revision ordering is stable across developer machines
# in different timezones.
timezone = UTC

# truncate long revision messages in the filename slug
truncate_slug_length = 40

# sqlalchemy.url is intentionally left empty. The connection URL is injected by
# migrations/env.py from shared.config.get_database_url() at runtime.
sqlalchemy.url =

[post_write_hooks]
# Keep generated revisions formatted to project standards. Requires ruff to be
# on PATH; harmless if absent (Alembic just skips the hook).
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff format

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S