[project]
name = "hirenovik"
version = "1.0.0"
description = "Job market analytics platform for LATAM tech jobs"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "beautifulsoup4",
    "cloudscraper",
    "fake-useragent",
    "fpdf2",
    "markdownify",
    "pandas",
    "psycopg2-binary",
    "python-dotenv",
    "python-jobspy",
    "requests",
    "SQLAlchemy",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
