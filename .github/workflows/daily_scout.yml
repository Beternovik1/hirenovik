name: Job Scout Diario (Docker)
# .github/workflows/daily_scout.yml
on:
  schedule:
    # It's going to start the scout everyday at 12:00 UTC (6:00AM CST in Irapuato)
    - cron: '17 12 * * *'
  workflow_dispatch: # Manual button for testings

# Prevent overlapping scraper runs against the same datacenter IP. Scheduled and
# manual runs share one concurrency group; a new run waits for the previous one
# to finish rather than canceling it mid-scrape (canceling could leave the DB in
# a partial PENDING_ENRICHMENT state).
concurrency:
  group: daily-scout
  cancel-in-progress: false

jobs:
  run-docker-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Downloading the code
      uses: actions/checkout@v4

    - name: Building docker image
      run: docker build -t bajio-scout .

    - name: Executing the container
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        docker run --rm \
        -e EMAIL_USER="${EMAIL_USER}" \
        -e EMAIL_PASS="${EMAIL_PASS}" \
        -e DATABASE_URL="${DATABASE_URL}" \
        -e WORKER_NAME="GitHub_Actions" \
        -e EXECUTION_MODE="multi_profile_cloud_extraction" \
        -e PROFILE_COOLDOWN_SECONDS="60" \
        bajio-scout